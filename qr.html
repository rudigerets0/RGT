<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Betaal-QR</title>
<style>
  html,body{ margin:0; padding:0; height:100%; background:#fff;
             display:flex; align-items:center; justify-content:center;
             font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
  /* QR vult de web viewer en blijft vierkant; grootte = grootte van de web viewer */
  #qr{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #qr img, #qr canvas{ width:100%; height:100%; object-fit:contain;
                       image-rendering:pixelated; }
  #err{ color:#666; font-size:13px; padding:12px; text-align:center; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div id="qr"></div>
  <script>
    // De betaalgegevens komen na de # in de URL. Een fragment (#...) wordt
    // NOOIT naar de server gestuurd, dus IBAN/bedrag blijven lokaal.
    (function () {
      // De payload staat als base64url na de # (blijft lokaal: fragment gaat niet naar server).
      var raw = (location.hash || "").substring(1);
      raw = raw.replace(/-/g, "+").replace(/_/g, "/");   // base64url -> base64
      var payload = "";
      try { payload = atob(raw); } catch (e) { payload = ""; }
      var box = document.getElementById("qr");
      if (!payload) {
        box.innerHTML = '<div id="err">Geen betaalgegevens</div>';
        return;
      }
      // Genereer op hoge resolutie voor scherpe print; CSS schaalt hem
      // vervolgens naar de grootte van de web viewer.
      new QRCode(box, {
        text: payload,
        width: 400,
        height: 400,
        correctLevel: QRCode.CorrectLevel.M   // aanbevolen voor EPC/SEPA-QR
      });
    })();
  </script>
</body>
</html>
